{{ define "main" }}
<style>
	.route-page {
		max-width: 1400px;
		margin: 0 auto;
		padding: 4rem 3rem;
	}
	.route-page__head {
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 1.5rem;
		margin-bottom: 2.5rem;
	}
	.route-page__head h1 {
		margin: 0;
		font-weight: 300;
	}
	.route-page__frame {
		display: block;
		width: 100%;
		height: 70vh;
		min-height: 420px;
		border: solid 1px rgba(0, 0, 0, 0.15);
		border-radius: 0.375rem;
	}
	.route-page__actions {
		margin: 2rem 0 0 0;
		text-align: center;
	}
	@media screen and (max-width: 736px) {
		.route-page {
			padding: 2.5rem 1.5rem;
		}
	}
</style>
<section class="route-page">
	<div class="route-page__head">
		<h1>{{ .Title }}</h1>
		<a href="/" class="button small icon solid fa-arrow-left smooth-scroll">На головну</a>
	</div>
	<iframe class="route-page__frame" src="{{ (.OutputFormats.Get "gpsmap").RelPermalink }}" title="{{ .Title }}" loading="lazy"></iframe>
	{{ with .Params.gpx_url }}
	<div class="route-page__actions">
		<a href="{{ . }}" class="button small icon fa-download">Завантажити GPX</a>
	</div>
	{{ end }}
</section>
{{ end }}
