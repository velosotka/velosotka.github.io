<!-- Banner -->
<style>
    .year-timeline {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(3.4rem, 1fr));
        gap: 0.6rem 0.4rem;
        position: relative;
        width: 100%;
    }
    .year-timeline__year {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding-top: 1.9rem;
        min-width: 3.4rem;
        font-size: 0.85rem;
        font-weight: 300;
        border-bottom: none;
        text-decoration: none;
        box-shadow: none;
        color: inherit;
        transition: color 0.2s ease;
    }
    .year-timeline__year::before {
        content: '';
        position: absolute;
        top: 0.3rem;
        width: 1.6rem;
        height: 1.2rem;
        background: currentColor;
        -webkit-mask: url('/images/bike.svg') no-repeat center / contain;
        mask: url('/images/bike.svg') no-repeat center / contain;
        transition: transform 0.2s ease;
    }
    .year-timeline__year:hover,
    .year-timeline__year:focus {
        color: inherit;
    }
    .year-timeline__year:hover::before,
    .year-timeline__year:focus::before {
        transform: scale(1.25);
    }
</style>
<section class="banner {{ .style }}" id="{{ .id }}">
    <div class="content">
        {{ with .title }}<h1><a href="#{{ $.id }}" id="{{ $.id }}">{{ . }}</a></h1>{{ end }}
        {{ with .subtitle }}<p class="major">{{ . | safeHTML }}</p>{{ end }}
        {{ with .content }}<p>{{ . | safeHTML }}</p>{{ end }}
        <nav class="year-timeline" aria-label="Маршрути за роками">
            {{ range seq 2014 2026 }}
            <a href="#{{ . }}" class="year-timeline__year smooth-scroll" title="Маршрут за {{ . }} рік">{{ . }}</a>
            {{ end }}
        </nav>
    </div>
    {{ with .image }}<a href="{{ $.image_url }}" target="_blank" class="image">
        <picture>
            <source srcset="{{ replace . ".jpg" ".webp" }}" type="image/webp">
            <img src="{{ . }}" alt="{{ $.image_title }}" title="{{ $.image_title }}" />
        </picture>
    </a>{{ end }}
</section>
