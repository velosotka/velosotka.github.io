title: "2026"
date: "August 30"
content: |
  Вперше за всі роки Київська Сотка <a href="https://www.facebook.com/velo100ka/posts/pfbid02hRSZWSEUiWuFkUFJFjdLuAq15KHFR2Pn2bCd41d5b3DkLgosp9a5aTUbWSuTY7whl" target="_blank">відбудеться в заключну неділю літа</a>, а не у вересні.
  Старт та фініш відбудеться в місті <a href="https://www.instagram.com/p/DbGO39giL-q/" target="_blank">Буча</a>.
  Організатори <a href="https://www.instagram.com/p/Da8SNziizvD/" target="_blank">пояснили</a> це рішення:
  <blockquote>
  Ще до повномасштабного вторгнення Міська рада Бучі пропонувала нам провести перегони зі стартом та фінішем в місті.
  І цього року така нагода трапилась!
  Наш близький приятель і постійний учасник Сотки запропонував об’єднати святкування 100-річчя компанії UTEM та проведення Київської Сотки 2026,
  включити нашу спортивну подію в серію ювілейних урочистостей.
  Ми дуже раді такому партнерству та скористаємось приводом насолодитись краєвидами північної Київщини.
  </blockquote>
  Також доступна можливість взяти участь в <a href="https://www.instagram.com/p/DcNjAS-iBxB/" target="_blank">онлайн форматі</a> у будь-якій точці світу.
  Всі гроші від реєстрацій будуть спрямовані на благодійність.
