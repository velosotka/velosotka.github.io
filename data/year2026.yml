content: |
  Вперше за всі роки Київська Сотка <a href="https://www.facebook.com/velo100ka/posts/pfbid02hRSZWSEUiWuFkUFJFjdLuAq15KHFR2Pn2bCd41d5b3DkLgosp9a5aTUbWSuTY7whl" target="_blank">відбулась в заключну неділю літа</a>, а не у вересні.
  Старт та фініш дали в місті <a href="https://youtu.be/4_NRCwFBlHg" target="_blank">Буча</a> під дощем.
  Попри нескінченні тривоги, вдалось провести спортивну частину заходу.
  У зв'язку з оголошеним напередодні Днем жалоби, всі музичні активності та нагородження перенесли на пізніше.
